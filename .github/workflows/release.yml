name: Build release binaries

on:
  # Auto-cut a versioned release on every merge to main (patch bump).
  push:
    branches: [main]
  # Manual release against an explicit tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/attach assets to (e.g. v0.4.0). Leave blank to auto patch-bump.'
        required: false
  # A release created manually in the GitHub UI.
  release:
    types: [created]

# Serialize release runs so two merges can't race to claim the same tag.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Keep exception-lower's LLVM at or ahead of the clang release stream it is
  # expected to process. LLVM bitcode is only backward compatible, so linking
  # an older LLVM than the producing clang silently corrupts IR (constant
  # expressions decoded as `undef`). The current clang release stream is 20.x.
  LLVM_VERSION: "20.1.6"

jobs:
  # ── Resolve (and, for auto/dispatch, create) the release tag ──────────
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            # push to main / dispatch without a tag: auto patch-bump the
            # latest semver-ish v*.*.* tag (start at v0.1.0 if none exist).
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              ver=${latest#v}
              major=${ver%%.*}
              rest=${ver#*.}
              minor=${rest%%.*}
              patch=${rest#*.}
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; attaching assets to it."
          else
            echo "Creating release $tag at ${{ github.sha }}"
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "$tag" \
              --generate-notes
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            artifact: exception-lower-linux-x64.tar.gz
          - label: linux-arm64
            os: ubuntu-22.04-arm
            artifact: exception-lower-linux-arm64.tar.gz
          - label: macos-x64
            os: macos-13
            artifact: exception-lower-macos-x64.tar.gz
          - label: macos-arm64
            os: macos-14
            artifact: exception-lower-macos-arm64.tar.gz
          - label: windows-x64
            os: windows-latest
            artifact: exception-lower-windows-x64.zip
            llvm_asset: clang+llvm-20.1.6-x86_64-pc-windows-msvc.tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Linux: install the LLVM 20 dev toolchain from apt.llvm.org ────
      # The official llvm.org release tarballs ship LTO/bitcode static
      # archives that GNU ld cannot link ("libLLVMCore.a: file format not
      # recognized"). apt.llvm.org's -dev packages provide normal ELF
      # libraries and track the latest 20.1.x point release, which
      # satisfies the LLVM >= 20 requirement the version guard enforces.
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y --no-install-recommends llvm-20-dev clang-20
          echo "LLVM_ROOT=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_ROOT/lib/cmake/llvm"
          cmake --build build --config Release -j"$(nproc)"
          strip build/exception-lower

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/bin
          cp -f build/exception-lower pkg/bin/
          tar -czf ${{ matrix.artifact }} -C pkg bin

      # ── macOS: no official LLVM 20.1.x macOS binaries, use Homebrew ───
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@20
          echo "LLVM_PREFIX=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
          strip build/exception-lower

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkg/bin
          cp -f build/exception-lower pkg/bin/
          tar -czf ${{ matrix.artifact }} -C pkg bin

      # ── Windows: official LLVM 20.1.6 MSVC release ────────────────────
      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-win
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-windows-x64

      - name: Download LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/${{ matrix.llvm_asset }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz -UseBasicParsing
          7z x llvm.tar.xz -so | 7z x -si -ttar -oC:\llvm-extract
          $dir = Get-ChildItem C:\llvm-extract -Directory | Select-Object -First 1
          Move-Item $dir.FullName C:\llvm

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The LLVM prebuilt has hardcoded DIA SDK paths from its
          # original build machine. Patch the cmake configs to use the
          # actual DIA SDK location on this runner.
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          $diaLib = Join-Path $vsPath "DIA SDK\lib\amd64"
          if (-not (Test-Path $diaLib)) {
            Write-Error "DIA SDK not found at $diaLib"
            exit 1
          }
          Write-Host "DIA SDK lib: $diaLib"
          $env:LIB = "$diaLib;$env:LIB"

          # Patch hardcoded DIA SDK paths in LLVM cmake files
          # CMake needs forward slashes on Windows paths.
          $cmakeDir = "C:\llvm\lib\cmake\llvm"
          $diaLibFwd = $diaLib -replace '\\', '/'
          Get-ChildItem $cmakeDir -Filter *.cmake | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'DIA SDK') {
              $patched = $content -replace '[A-Z]:[^;"]*DIA SDK[/\\]lib[/\\]amd64', $diaLibFwd
              Set-Content $_.FullName -Value $patched -NoNewline
              Write-Host "  Patched: $($_.Name)"
            }
          }

          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR=C:\llvm\lib\cmake\llvm
          cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg\bin -Force | Out-Null
          Copy-Item build\Release\exception-lower.exe pkg\bin\
          Compress-Archive -Path pkg\bin\* -DestinationPath ${{ matrix.artifact }}

      # ── Upload to the resolved release ────────────────────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
