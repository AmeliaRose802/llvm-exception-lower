name: CI

on:
  pull_request:
  push:
    branches: [main]

# Allow only one concurrent run per ref; cancel in-progress runs of older
# commits on the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # exception-lower must link an LLVM at least as new as the clang release
  # stream whose bitcode it processes (the downstream toolchain ships
  # clang/LLVM 20). LLVM bitcode is only backward compatible, so an older
  # reader silently miscompiles newer constant expressions to `undef`.
  LLVM_VERSION: "20.1.6"

jobs:
  build-test:
    name: Build & test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            artifact: exception-lower-linux-x64.tar.gz
          - label: linux-arm64
            os: ubuntu-22.04-arm
            artifact: exception-lower-linux-arm64.tar.gz
          - label: macos-x64
            os: macos-13
            artifact: exception-lower-macos-x64.tar.gz
          - label: macos-arm64
            os: macos-14
            artifact: exception-lower-macos-arm64.tar.gz
          - label: windows-x64
            os: windows-latest
            artifact: exception-lower-windows-x64.zip
            llvm_asset: clang+llvm-20.1.6-x86_64-pc-windows-msvc.tar.xz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Linux: install the LLVM 20 dev toolchain from apt.llvm.org ────
      # The official llvm.org release tarballs ship LTO/bitcode static
      # archives that GNU ld cannot link ("libLLVMCore.a: file format not
      # recognized"). apt.llvm.org's -dev packages provide normal ELF
      # libraries and track the latest 20.1.x point release, which
      # satisfies the LLVM >= 20 requirement the version guard enforces.
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y --no-install-recommends llvm-20-dev clang-20
          echo "LLVM_ROOT=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Build & test (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_ROOT/lib/cmake/llvm"
          cmake --build build --config Release -j"$(nproc)"
          CLANGXX="$LLVM_ROOT/bin/clang++" \
          OPT="$LLVM_ROOT/bin/opt" \
          LLVM_DIS="$LLVM_ROOT/bin/llvm-dis" \
          EXCLOW_BIN="${{ github.workspace }}/build/exception-lower" \
            bash tests/run.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          strip build/exception-lower
          mkdir -p pkg/bin
          cp -f build/exception-lower pkg/bin/
          tar -czf ${{ matrix.artifact }} -C pkg bin

      # ── macOS: the LLVM project ships no macOS binaries for 20.1.x, so
      #    use Homebrew's llvm@20 (a 20.1.x, which satisfies the LLVM >= 20
      #    requirement the version guard enforces). ────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@20
          echo "LLVM_PREFIX=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"

      - name: Build & test (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"
          CLANGXX="$LLVM_PREFIX/bin/clang++" \
          OPT="$LLVM_PREFIX/bin/opt" \
          LLVM_DIS="$LLVM_PREFIX/bin/llvm-dis" \
          EXCLOW_BIN="${{ github.workspace }}/build/exception-lower" \
            bash tests/run.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          strip build/exception-lower
          mkdir -p pkg/bin
          cp -f build/exception-lower pkg/bin/
          tar -czf ${{ matrix.artifact }} -C pkg bin

      # ── Windows: fetch the official LLVM 20.1.6 MSVC release ──────────
      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-win
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-windows-x64

      - name: Download LLVM (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/${{ matrix.llvm_asset }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz -UseBasicParsing
          7z x llvm.tar.xz -so | 7z x -si -ttar -oC:\llvm-extract
          $dir = Get-ChildItem C:\llvm-extract -Directory | Select-Object -First 1
          Move-Item $dir.FullName C:\llvm

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The LLVM Windows prebuilt has hardcoded DIA SDK paths from its
          # original build machine. Patch the cmake configs to use the
          # actual DIA SDK location on this runner.
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          $diaLib = Join-Path $vsPath "DIA SDK\lib\amd64"
          if (-not (Test-Path $diaLib)) {
            Write-Error "DIA SDK not found at $diaLib"
            exit 1
          }
          Write-Host "DIA SDK lib: $diaLib"
          $env:LIB = "$diaLib;$env:LIB"

          $cmakeDir = "C:\llvm\lib\cmake\llvm"
          $diaLibFwd = $diaLib -replace '\\', '/'
          Get-ChildItem $cmakeDir -Filter *.cmake | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'DIA SDK') {
              $patched = $content -replace '[A-Z]:[^;"]*DIA SDK[/\\]lib[/\\]amd64', $diaLibFwd
              Set-Content $_.FullName -Value $patched -NoNewline
              Write-Host "  Patched: $($_.Name)"
            }
          }

          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR=C:\llvm\lib\cmake\llvm
          cmake --build build --config Release

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_BIN: C:\llvm\bin
          EXCLOW_BIN: ${{ github.workspace }}\build\Release\exception-lower.exe
        run: pwsh tests/run.ps1

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg\bin -Force | Out-Null
          Copy-Item build\Release\exception-lower.exe pkg\bin\
          Compress-Archive -Path pkg\bin\* -DestinationPath ${{ matrix.artifact }}

      # ── Upload built binary as a workflow artifact ────────────────────
      # Always uploaded so PR reviewers can grab a build, and so the
      # publish-latest job below can pull them on push-to-main.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  # On push to main (i.e. after a PR merges), publish the freshly built
  # binaries for every platform label to a rolling `latest-main`
  # pre-release. This keeps the tag-driven release.yml workflow free to
  # handle stable versioned releases.
  publish-latest:
    name: Publish rolling latest-main pre-release
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p staging
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp -f {} staging/ \;
          ls -la staging

      - name: Delete previous latest-main release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true

      - name: Publish latest-main pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest build from main"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Rolling build of `main` (commit ${{ github.sha }}), linked
            against LLVM ${{ env.LLVM_VERSION }}.

            These binaries are produced automatically by the CI workflow
            every time a PR merges into `main`. For stable versioned
            releases, see the tagged releases.
          files: |
            staging/*.tar.gz
            staging/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
